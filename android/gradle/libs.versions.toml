[versions]
agp                     = "8.4.0"
kotlin                  = "2.0.0"
junit                   = "4.13.2"
ksp                     = "2.0.0-1.0.21"
compose-bom             = "2024.06.00"
hilt                    = "2.51"
hilt-navigation-compose = "1.2.0"
navigation-compose      = "2.7.7"
firebase-bom            = "33.1.0"
revenuecat              = "9.22.0"
maps-compose            = "4.3.3"
play-services-maps      = "19.0.0"
play-services-location  = "21.3.0"
rootbeer                = "0.1.0"
work-runtime            = "2.9.0"
hilt-work               = "1.2.0"
appauth                 = "0.11.1"
security-crypto         = "1.1.0-alpha06"
room                    = "2.6.1"
retrofit                = "2.11.0"
okhttp                  = "4.12.0"
vico                    = "1.13.1"
health-connect          = "1.1.0-alpha10"
coil                    = "2.7.0"
media3                  = "1.4.1"
kotlinx-serialization   = "1.7.1"
coroutines              = "1.8.1"
lifecycle               = "2.8.3"
paging                  = "3.3.0"
datastore               = "1.1.1"
play-integrity          = "1.4.0"
biometric               = "1.1.0"
appcompat               = "1.7.0"
# Wear OS companion (phone-tracked mode — see WearSync.kt's doc comment):
# Wearable Data Layer API on the phone side, Wear Compose + the same API on
# the watch side. Versions picked to match this project's existing Compose
# BOM 2024.06.00 / Kotlin 2.0.0 timeframe.
play-services-wearable  = "18.2.0"
wear-compose            = "1.3.1"

[libraries]
# Compose BOM
compose-bom           = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui            = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling    = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3     = { group = "androidx.compose.material3", name = "material3" }
compose-animation     = { group = "androidx.compose.animation", name = "animation" }
compose-foundation    = { group = "androidx.compose.foundation", name = "foundation" }
compose-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
activity-compose      = { group = "androidx.activity", name = "activity-compose", version = "1.9.0" }

# Testing
junit                 = { group = "junit", name = "junit", version.ref = "junit" }

# Navigation
navigation-compose    = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation-compose" }

# Lifecycle
lifecycle-viewmodel   = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime     = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

# Hilt
hilt-android          = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler         = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation       = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hilt-navigation-compose" }
hilt-work             = { group = "androidx.hilt", name = "hilt-work", version.ref = "hilt-work" }
hilt-work-compiler    = { group = "androidx.hilt", name = "hilt-compiler", version.ref = "hilt-work" }

# Firebase
firebase-bom          = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebase-bom" }
firebase-auth         = { group = "com.google.firebase", name = "firebase-auth-ktx" }
firebase-firestore    = { group = "com.google.firebase", name = "firebase-firestore-ktx" }
firebase-functions    = { group = "com.google.firebase", name = "firebase-functions-ktx" }
firebase-storage      = { group = "com.google.firebase", name = "firebase-storage-ktx" }
firebase-remote-config = { group = "com.google.firebase", name = "firebase-config-ktx" }
firebase-app-check    = { group = "com.google.firebase", name = "firebase-appcheck-playintegrity" }
firebase-app-check-debug = { group = "com.google.firebase", name = "firebase-appcheck-debug" }
firebase-messaging    = { group = "com.google.firebase", name = "firebase-messaging-ktx" }

# Maps
maps-compose          = { group = "com.google.maps.android", name = "maps-compose", version.ref = "maps-compose" }
play-services-maps    = { group = "com.google.android.gms", name = "play-services-maps", version.ref = "play-services-maps" }
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "play-services-location" }

# Security
rootbeer              = { group = "com.scottyab", name = "rootbeer-lib", version.ref = "rootbeer" }
security-crypto       = { group = "androidx.security", name = "security-crypto", version.ref = "security-crypto" }
play-integrity        = { group = "com.google.android.play", name = "integrity", version.ref = "play-integrity" }
biometric             = { group = "androidx.biometric", name = "biometric", version.ref = "biometric" }
appcompat             = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }

# RevenueCat
revenuecat            = { group = "com.revenuecat.purchases", name = "purchases", version.ref = "revenuecat" }
revenuecat-ui         = { group = "com.revenuecat.purchases", name = "purchases-ui", version.ref = "revenuecat" }

# Networking
retrofit              = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-kotlin-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp                = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging        = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }

# Charts
vico-compose          = { group = "com.patrykandpatrick.vico", name = "compose", version.ref = "vico" }
vico-compose-m3       = { group = "com.patrykandpatrick.vico", name = "compose-m3", version.ref = "vico" }

# Health Connect
health-connect        = { group = "androidx.health.connect", name = "connect-client", version.ref = "health-connect" }

# Image loading
coil                  = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

# Video (Welcome screen looping background)
media3-exoplayer      = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-ui             = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }

# Room (offline cache)
room-runtime          = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-compiler         = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
room-ktx              = { group = "androidx.room", name = "room-ktx", version.ref = "room" }

# WorkManager
work-runtime          = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work-runtime" }

# Paging
paging-runtime        = { group = "androidx.paging", name = "paging-runtime-ktx", version.ref = "paging" }
paging-compose        = { group = "androidx.paging", name = "paging-compose", version.ref = "paging" }

# DataStore
datastore-prefs       = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# AppAuth
appauth               = { group = "net.openid", name = "appauth", version.ref = "appauth" }

# Coroutines
coroutines-android    = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-play-services = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-play-services", version.ref = "coroutines" }

# Serialization
kotlinx-serialization = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinx-serialization" }

# Wear OS companion (phone-tracked mode)
play-services-wearable = { group = "com.google.android.gms", name = "play-services-wearable", version.ref = "play-services-wearable" }
wear-compose-material  = { group = "androidx.wear.compose", name = "compose-material", version.ref = "wear-compose" }
wear-compose-foundation = { group = "androidx.wear.compose", name = "compose-foundation", version.ref = "wear-compose" }

[plugins]
android-application   = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm            = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-android        = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose        = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization  = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt-android          = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
google-services       = { id = "com.google.gms.google-services", version = "4.4.2" }
ksp                   = { id = "com.google.devtools.ksp", version.ref = "ksp" }
