appId: com.antoinekh.ruvoapplication
tags:
  - auth
  - community
  - leaderboard
---
# Community > Leaderboard tab: scope pills, podium, user rows
- launchApp:
    stopApp: false
- waitForAnimationToEnd

- tapOn:
    id: "tab-community"
- waitForAnimationToEnd

- tapOn: "Leaderboard"
- waitForAnimationToEnd

# Default scope = Global — verify scope pills render
- assertVisible: "Global"
- assertVisible: "Friends"
- assertVisible: "Lebanon"

# Switch to Lebanon scope
- tapOn: "Lebanon"
- waitForAnimationToEnd
- assertVisible: "Lebanon"

# Switch to Friends scope
- tapOn: "Friends"
- waitForAnimationToEnd

# Switch back to Global
- tapOn: "Global"
- waitForAnimationToEnd

# Verify time filter pills
- assertVisible: "This Week"
- assertVisible: "This Month"
- assertVisible: "All Time"

# Tap All Time
- tapOn: "All Time"
- waitForAnimationToEnd

# Tap This Month
- tapOn: "This Month"
- waitForAnimationToEnd

# Scroll to see full list
- scrollTo:
    direction: down
    speed: 40
    duration: 800
