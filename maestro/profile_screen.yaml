appId: com.antoinekh.ruvoapplication
tags:
  - auth
  - profile
---
# Profile screen: stats, tabs, gear tracker, settings navigation
- launchApp:
    stopApp: false
- waitForAnimationToEnd

- tapOn:
    id: "tab-profile"
- waitForAnimationToEnd

# Header
- assertVisible: "Profile"

# Social stats
- assertVisible: "Followers"
- assertVisible: "Following"

# Run stats
- assertVisible: "Total Runs"
- assertVisible: "Avg Pace"

# XP progress
- assertVisible: "XP Progress"

# Menu items
- assertVisible: "My Gear Tracker"
- assertVisible: "Country"

# Tab bar: Activity / Saved Library
- assertVisible: "Activity"
- assertVisible: "Saved Library"

# Tap Activity tab
- tapOn: "Activity"
- waitForAnimationToEnd
- assertVisible: "Active Challenges"

# Tap Saved Library tab
- tapOn: "Saved Library"
- waitForAnimationToEnd

# Navigate to Gear Tracker
- tapOn: "My Gear Tracker"
- waitForAnimationToEnd
- assertVisible: "My Gear"
- back
- waitForAnimationToEnd

# Navigate to Achievements via Followers → back
- tapOn: "Followers"
- waitForAnimationToEnd
- back
- waitForAnimationToEnd

# Scroll to bottom
- scrollTo:
    direction: down
    speed: 40
    duration: 800
