appId: com.antoinekh.ruvoapplication
tags:
  - auth
  - home
  - dashboard
---
# Home Screen: smoke test — verifies key elements render after login
# Replaced shallow test with accurate labels from HomeScreen.js
- launchApp:
    stopApp: false
- waitForAnimationToEnd

- assertVisible: "WELCOME BACK"
- assertVisible: "Today's Steps"
- assertVisible: "Resting HR"
- assertVisible: "Calories"
- assertVisible: "Performance Insights"
- assertVisible: "Today's workout"
- assertVisible: "Start run"

# Scroll to see bento dashboard
- scrollTo:
    direction: down
    speed: 40
    duration: 600
- assertVisible: "WEEKLY GOAL"
- assertVisible: "AI COACH"
- assertVisible: "STREAK"
