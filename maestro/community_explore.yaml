appId: com.antoinekh.ruvoapplication
tags:
  - auth
  - community
  - explore
---
# Community > Explore tab: route filter pills, route cards
- launchApp:
    stopApp: false
- waitForAnimationToEnd

- tapOn:
    id: "tab-community"
- waitForAnimationToEnd

- tapOn: "Explore"
- waitForAnimationToEnd

# Verify filter pills
- assertVisible: "All"
- assertVisible: "Community"
- assertVisible: "Featured"

# Tap Community filter
- tapOn: "Community"
- waitForAnimationToEnd

# Tap Featured filter
- tapOn: "Featured"
- waitForAnimationToEnd

# Tap All to reset
- tapOn: "All"
- waitForAnimationToEnd

# Scroll down to see route cards
- scrollTo:
    direction: down
    speed: 40
    duration: 800
