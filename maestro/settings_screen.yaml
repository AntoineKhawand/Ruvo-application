appId: com.antoinekh.ruvoapplication
tags:
  - auth
  - settings
---
# Settings screen: all sections, navigation to sub-screens
- launchApp:
    stopApp: false
- waitForAnimationToEnd

# Navigate to Profile first, then Settings from there
- tapOn:
    id: "tab-profile"
- waitForAnimationToEnd

# Scroll down to find Settings row or settings icon
- scrollTo:
    direction: down
    speed: 40
    duration: 600

# Open Settings (gear icon in Profile header area)
- runFlow:
    when:
      visible: "Settings"
    commands:
      - tapOn: "Settings"
      - waitForAnimationToEnd

# ── Settings screen sections ────────────────────────────────────────────────
- assertVisible: "Manage Subscription"
- assertVisible: "Privacy Controls"
- assertVisible: "CONNECTED DEVICES"
- assertVisible: "Notifications"
- assertVisible: "Help Center"
- assertVisible: "Log Out"
- assertVisible: "Delete Account"

# Navigate to Help Center
- tapOn: "Help Center"
- waitForAnimationToEnd
- assertVisible: "Help Center"
- back
- waitForAnimationToEnd

# Navigate to Privacy Controls
- tapOn: "Privacy Controls"
- waitForAnimationToEnd
- assertVisible: "Privacy"
- back
- waitForAnimationToEnd

# Navigate to Connected Devices
- tapOn:
    id: "tab-profile"
- waitForAnimationToEnd
- scrollTo:
    direction: down
    speed: 40
    duration: 600
