appId: com.antoinekh.ruvoapplication
tags:
  - auth
  - home
  - dashboard
---
# Home Dashboard: Deep test of all bento cards, navigation, and Start Run CTA
# Requires an authenticated session (run login_authenticated.yaml first)
- launchApp:
    stopApp: false
- waitForAnimationToEnd

# ── Header ────────────────────────────────────────────────────────────────────
- assertVisible: "WELCOME BACK"

# ── Health stats row ─────────────────────────────────────────────────────────
- assertVisible: "Today's Steps"
- assertVisible: "Resting HR"
- assertVisible: "Calories"
- assertVisible: "Avg BPM"

# ── Performance Insights ─────────────────────────────────────────────────────
- assertVisible: "Performance Insights"
- assertVisible: "30-DAY AVG PACE"
- assertVisible: "CONSISTENCY"

# ── Today's workout card ─────────────────────────────────────────────────────
- assertVisible: "Today's workout"
- assertVisible: "Start run"

# Tap Start run → ActiveRun screen opens
- tapOn: "Start run"
- waitForAnimationToEnd
- assertVisible: "0:00"
- back
- waitForAnimationToEnd

# ── Dashboard bento grid ─────────────────────────────────────────────────────
- scrollTo:
    direction: down
    speed: 40
    duration: 800

- assertVisible: "WEEKLY GOAL"
- assertVisible: "BALANCE"
- assertVisible: "AI COACH"
- assertVisible: "STEPS TODAY"
- assertVisible: "RESTING HR"
- assertVisible: "STREAK"
- assertVisible: "ANALYTICS"

# Tap AI COACH card → navigates to AICoach screen
- tapOn: "AI COACH"
- waitForAnimationToEnd
- assertVisible: "AI Coach"
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd

# Tap WEEKLY GOAL card → navigates to Plan screen
- tapOn: "WEEKLY GOAL"
- waitForAnimationToEnd
- assertVisible: "Training Plan"
- back
- waitForAnimationToEnd

# ── Tips section ─────────────────────────────────────────────────────────────
- scrollTo:
    direction: down
    speed: 40
    duration: 1200
- assertVisible: "Tips for today"
