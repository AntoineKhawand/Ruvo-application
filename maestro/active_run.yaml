appId: com.antoinekh.ruvoapplication
tags:
  - auth
  - run
---
# Active Run: launch, verify dashboard metrics, pause, resume, finish
- launchApp:
    stopApp: false
- waitForAnimationToEnd

- tapOn:
    id: "tab-home"
- waitForAnimationToEnd

# Tap Start run from Today's workout card
- tapOn: "Start run"
- waitForAnimationToEnd

# ── Active Run screen metrics ─────────────────────────────────────────────────
- assertVisible: "TIME"
- assertVisible: "PACE"
- assertVisible: "KCAL"
- assertVisible: "BPM"

# Timer shows 00:00 at start
- assertVisible: "00:00"

# Pause the run
- tapOn: "PAUSE"
- waitForAnimationToEnd

# Timer is paused — RESUME button appears
- assertVisible: "RESUME"

# Resume
- tapOn: "RESUME"
- waitForAnimationToEnd

# PAUSE is back
- assertVisible: "PAUSE"

# ── Finish run ────────────────────────────────────────────────────────────────
# "HOLD TO FINISH" button requires a long press (hold gesture)
- assertVisible: "HOLD TO FINISH"
- assertVisible: "END SESSION"

- longPressOn: "HOLD TO FINISH"
- waitForAnimationToEnd

# After finishing → RateEffort or SaveActivity screen
- runFlow:
    when:
      visible: "Rate Effort"
    commands:
      - assertVisible: "Rate Effort"
      - runFlow:
          when:
            visible: "Skip"
          commands:
            - tapOn: "Skip"
            - waitForAnimationToEnd

- runFlow:
    when:
      visible: "Save Activity"
    commands:
      - assertVisible: "Save Activity"
      - assertVisible: "Save Run"
      - back

# Navigate back to home
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd
