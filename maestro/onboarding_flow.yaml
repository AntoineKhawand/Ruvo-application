appId: com.antoinekh.ruvoapplication
tags:
  - guest
  - onboarding
---
# Onboarding Flow: Test all 5 steps of the onboarding wizard
- launchApp:
    clearState: true
    permissions:
      all: deny
- waitForAnimationToEnd

# Navigate to Onboarding from Welcome
- tapOn: "Start Journey"
- waitForAnimationToEnd

# ============================
# STEP 1: Goal Selection
# ============================
- assertVisible: "What's your primary goal?"
- assertVisible: "Get Fitter"
- assertVisible: "Run my First 5K"
- assertVisible: "Train for Half-Marathon"

# Select a goal
- tapOn: "Get Fitter"
- tapOn: "Continue"
- waitForAnimationToEnd

# ============================
# STEP 2: Personal Info
# ============================
- assertVisible: "Tell us a bit about you."
- assertVisible: "What should we call you?"
- assertVisible: "Gender"
- assertVisible: "Male"
- assertVisible: "Female"
- assertVisible: "Date of Birth"
- assertVisible: "Weight (kg)"
- assertVisible: "Height (cm)"

# Fill in required fields
- tapOn:
    text: "e.g. Alex"
- inputText: "Test Runner"
- hideKeyboard

- tapOn: "Male"

- tapOn:
    text: "70"
- inputText: "75"
- hideKeyboard

- tapOn:
    text: "175"
- inputText: "180"
- hideKeyboard

- tapOn: "Continue"
- waitForAnimationToEnd

# ============================
# STEP 3: Set Rhythm (Frequency)
# ============================
- assertVisible: "Set your rhythm"
- assertVisible: "How many times a week"

# Tap Continue (using default frequency of 3)
- tapOn: "Continue"
- waitForAnimationToEnd

# ============================
# STEP 4: Personalize Plan (Days & Time)
# ============================
- assertVisible: "Let's Personalize your plan"
- assertVisible: "Which days are you available"

# Select Monday (M), Wednesday (W), Friday (F)
- tapOn: "M"
- tapOn: "W"
- tapOn: "F"
- assertVisible:
    text: "Selected:"
- waitForAnimationToEnd

- tapOn: "Continue"
- waitForAnimationToEnd

# ============================
# STEP 5: Permissions & Account
# ============================
- assertVisible: "Almost ready!"
- assertVisible: "Location Access"
- assertVisible: "Notifications"
- assertVisible: "Connect Devices"
- assertVisible: "Create Your Account"
