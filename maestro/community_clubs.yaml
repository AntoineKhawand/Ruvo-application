appId: com.antoinekh.ruvoapplication
tags:
  - auth
  - community
  - clubs
---
# Community > Clubs tab: list, search, create club, open club detail
- launchApp:
    stopApp: false
- waitForAnimationToEnd

- tapOn:
    id: "tab-community"
- waitForAnimationToEnd

- tapOn: "Clubs"
- waitForAnimationToEnd

# Verify clubs tab header elements
- assertVisible: "Clubs"

# Scroll to see club cards
- scrollTo:
    direction: down
    speed: 40
    duration: 800

# If any club visible, tap it to open ClubDetail
- runFlow:
    when:
      visible: "Members"
    commands:
      - tapOn: "Members"
      - waitForAnimationToEnd
      - back
      - waitForAnimationToEnd

# Open Create Club sheet
- runFlow:
    when:
      visible: "Create Club"
    commands:
      - tapOn: "Create Club"
      - waitForAnimationToEnd
      - assertVisible: "Create a Club"
      - back
      - waitForAnimationToEnd
