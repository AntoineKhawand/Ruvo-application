appId: com.antoinekh.ruvoapplication
tags:
  - auth
  - community
  - feed
---
# Community > Feed tab: cheer, comment, and post card visibility
- launchApp:
    stopApp: false
- waitForAnimationToEnd

# Navigate to Community
- tapOn:
    id: "tab-community"
- waitForAnimationToEnd
- assertVisible: "Community"

# Default tab is Feed
- assertVisible: "Feed"
- assertVisible: "Leaderboard"
- assertVisible: "Clubs"
- assertVisible: "Explore"

# Tap Feed tab (already active but confirm visible content)
- tapOn: "Feed"
- waitForAnimationToEnd

# If feed has posts, cheer the first one
- runFlow:
    when:
      visible: "🔥"
    commands:
      - tapOn: "🔥"
      - waitForAnimationToEnd

# Scroll down a bit to see more posts
- scrollTo:
    direction: down
    speed: 40
    duration: 1000

- scrollTo:
    direction: up
    speed: 40
    duration: 800
