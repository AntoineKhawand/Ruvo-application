appId: com.antoinekh.ruvoapplication
tags:
  - auth
  - plan
---
# Plan / Training Plan screen: week view, workout cards
- launchApp:
    stopApp: false
- waitForAnimationToEnd

- tapOn:
    id: "tab-plan"
- waitForAnimationToEnd

# Plan screen header
- assertVisible: "Training Plan"

# Verify week navigation elements
- assertVisible:
    text: "This Week"
  optional: true

# Scroll to see planned workouts
- scrollTo:
    direction: down
    speed: 40
    duration: 800

# Go back to home
- tapOn:
    id: "tab-home"
- waitForAnimationToEnd
