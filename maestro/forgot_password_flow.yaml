appId: com.antoinekh.ruvoapplication
tags:
  - guest
  - forgot-password
---
# Forgot Password Screen: Verify form, cooldown timer, and navigation
- launchApp:
    clearState: true
    permissions:
      all: deny
- waitForAnimationToEnd

# Navigate: Welcome → Log In → Forgot Password
- tapOn: "Log In"
- waitForAnimationToEnd
- tapOn: "Forgot Password?"
- waitForAnimationToEnd

# Verify Forgot Password screen elements
- assertVisible: "Reset Password"
- assertVisible: "Enter your email address"

# Verify email input exists
- assertVisible:
    text: "Enter your email"

# Verify Send Reset Link button
- assertVisible: "Send Reset Link"

# Verify escape route back to login
- assertVisible: "Remember your password?"
- assertVisible: "Log In"

# Test: Enter an email
- tapOn:
    text: "Enter your email"
- inputText: "test@ruvo.run"
- hideKeyboard

# Tap back
- back
- waitForAnimationToEnd
- assertVisible: "Welcome Back!"
