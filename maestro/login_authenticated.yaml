appId: com.antoinekh.ruvoapplication
tags:
  - auth
  - login
---
# Login with real credentials to set up authenticated session for all auth flows.
# Edit EMAIL and PASSWORD before running.
- launchApp:
    clearState: true
    permissions:
      location: allow
      notifications: allow
- waitForAnimationToEnd

# If already on home screen, we are done
- runFlow:
    when:
      visible: "WELCOME BACK"
    commands:
      - evalScript: ${output.skipLogin = true}

# Otherwise navigate to login
- runFlow:
    when:
      visible: "Start Journey"
    commands:
      - tapOn: "Log In"
      - waitForAnimationToEnd
      - assertVisible: "Welcome Back!"
      - tapOn:
          text: "Email address"
        optional: true
      - runFlow:
          when:
            visible: "EMAIL ADDRESS"
          commands:
            - tapOn: "EMAIL ADDRESS"
      - inputText: "antoinekhawand04@gmail.com"
      - hideKeyboard
      - tapOn: "PASSWORD"
      - inputText: "${MAESTRO_PASSWORD}"
      - hideKeyboard
      - tapOn: "LOG IN"
      - waitForAnimationToEnd

# Wait for home screen to load
- assertVisible: "WELCOME BACK"
