name: Android CI

on:
  push:
    branches: [native-rewrite, main, master]
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  workflow_dispatch:

jobs:
  compile:
    name: Compile debug Kotlin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Provide google-services.json
        # android/app/google-services.json is gitignored (real Firebase
        # project credentials). If a GOOGLE_SERVICES_JSON secret is
        # configured (Settings -> Secrets -> Actions), use the real one so
        # CI matches production; otherwise fall back to a structurally
        # valid placeholder so the Google Services Gradle plugin has
        # something to parse -- this only unblocks compilation, it can't
        # reach a real backend.
        working-directory: android/app
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
          else
            printf '%s' '{"project_info":{"project_number":"000000000000","project_id":"ruvo-ci-placeholder","storage_bucket":"ruvo-ci-placeholder.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000000000","android_client_info":{"package_name":"com.ruvo.app"}},"oauth_client":[],"api_key":[{"current_key":"AIzaCiPlaceholderPlaceholderPlaceholderPlace"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}},{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000000001","android_client_info":{"package_name":"com.ruvo.app.debug"}},"oauth_client":[],"api_key":[{"current_key":"AIzaCiPlaceholderPlaceholderPlaceholderPlace"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > google-services.json
          fi

      - name: Compile debug Kotlin
        working-directory: android
        run: ./gradlew :app:compileDebugKotlin --console=plain

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --console=plain
